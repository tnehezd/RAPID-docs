name: Build RAPID Documentation

on:
  workflow_dispatch:
    inputs:
      rapid_tag:
        description: "RAPID release tag"
        required: true

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout RAPID-docs
        uses: actions/checkout@v4

      - name: Checkout RAPID
        uses: actions/checkout@v4
        with:
          repository: tnehezd/RAPID
          ref: ${{ inputs.rapid_tag }}
          path: RAPID
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Update documentation version
        env:
          RAPID_TAG: ${{ inputs.rapid_tag }}
        run: |
          RAPID_VERSION="${RAPID_TAG#v}"

          sed -i \
            "s/^release = .*/release = '${RAPID_VERSION}'/" \
            docs/conf.py

      - name: Generate Doxygen XML
        working-directory: docs
        run: |
          doxygen Doxyfile

      - name: Build Sphinx documentation
        working-directory: docs
        run: |
          sphinx-build -b html . _build/html

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: rapid-documentation
          path: docs/_build/html