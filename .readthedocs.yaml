version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.12"

  apt_packages:
    - doxygen

  jobs:
    pre_build:
      - git clone --depth 1 https://github.com/tnehezd/RAPID.git RAPID
      - cd docs && doxygen Doxyfile

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py