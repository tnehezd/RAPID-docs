version: 2

build:
  os: ubuntu-24.04

  tools:
    python: "3.12"

  apt_packages:
    - doxygen

  jobs:
    pre_build:
      - python -c "import runpy, subprocess; tag = runpy.run_path('docs/conf.py')['rapid_tag']; subprocess.run(['git', 'clone', '--depth', '1', '--branch', tag, '--single-branch', 'https://github.com/tnehezd/RAPID.git', 'RAPID'], check=True)"
      - cd docs && doxygen Doxyfile

python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py